<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>System message</title>
  <style>
    :root { background: #0078d7; }
    * { box-sizing: border-box; }
    body {
      align-items: flex-start;
      background: #0078d7;
      color: #fff;
      cursor: none;
      display: flex;
      font-family: "Segoe UI", system-ui, sans-serif;
      margin: 0;
      min-height: 100vh;
      padding: clamp(60px, 11vh, 150px) clamp(32px, 9vw, 180px);
    }
    main { max-width: 900px; }
    .face { font-size: clamp(72px, 11vw, 170px); font-weight: 300; line-height: .85; }
    p { font-size: clamp(20px, 2.1vw, 35px); line-height: 1.35; margin: 42px 0 0; }
    .progress { font-size: clamp(17px, 1.5vw, 25px); margin-top: 32px; }
    .hint { bottom: 22px; font-size: 13px; left: 28px; opacity: .5; position: fixed; }
    .photo {
      border: 8px solid #fff;
      box-shadow: 0 18px 48px rgba(0, 0, 0, .35);
      left: 50%;
      max-height: 76vh;
      max-width: 76vw;
      opacity: 0;
      position: fixed;
      top: 50%;
      transform: translate(-50%, -50%) scale(.88);
      transition: opacity .38s ease, transform .38s ease;
      z-index: 2;
    }
    body.show-photo .photo { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    body.finished main, body.finished .photo { opacity: 0; transition: opacity .45s ease; }
  </style>
</head>
<body>
  <main>
    <div class="face">:(</div>
    <p>
      Your PC ran into a problem and needs to restart.<br>
      We're just collecting some error info, and then we'll restart for you.
    </p>
    <p class="progress"><span id="percent">0</span>% complete</p>
  </main>
  <img class="photo" src="center-photo.png" alt="">
  <div class="hint">Click anywhere for full screen</div>

  <script>
    const duration = 10_000;
    const startedAt = performance.now();
    const percent = document.getElementById('percent');

    function update(now) {
      const elapsed = now - startedAt;
      percent.textContent = Math.min(100, Math.floor(elapsed / duration * 100));
      if (elapsed < duration) {
        requestAnimationFrame(update);
      } else {
        document.body.classList.add('finished');
      }
    }

    document.addEventListener('click', async () => {
      if (!document.fullscreenElement) {
        try { await document.documentElement.requestFullscreen(); } catch (_) {}
      }
    });

    setTimeout(() => document.body.classList.add('show-photo'), 2_000);
    requestAnimationFrame(update);
  </script>
</body>
</html>
